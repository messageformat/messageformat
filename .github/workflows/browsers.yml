name: Browsers

permissions: {}

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  browsers:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - run: npm ci
      - run: npx playwright install chromium firefox
      - run: npm run build
      - run: npm run test:browsers
